<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f2036" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Escano Construction LLC — Construction, Remodeling & Renovation</title>
    <meta
      name="description"
      content="Escano Construction LLC provides residential construction, remodeling, renovation, roofing, and light-commercial improvement services. Request a proposal for your project."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social foundation. Each route overrides title, description,
         url, and image via the usePageMeta hook once the app mounts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Escano Construction LLC" />
    <meta
      property="og:title"
      content="Escano Construction LLC — Building a Stronger Tomorrow"
    />
    <meta
      property="og:description"
      content="Residential construction, remodeling, renovation, roofing, and light-commercial improvements. Request a proposal for your project."
    />
    <meta property="og:image" content="https://jessabel.art/escano-construction/assets/brand/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Escano Construction LLC — Building a Stronger Tomorrow"
    />
    <meta
      name="twitter:description"
      content="Residential construction, remodeling, renovation, roofing, and light-commercial improvements. Request a proposal for your project."
    />
    <meta name="twitter:image" content="https://jessabel.art/escano-construction/assets/brand/og-image.jpg" />

    <!-- Fonts: Archivo (display) via Google Fonts, Satoshi (body) via Fontshare -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2-family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css-f[]=satoshi@400,500,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
