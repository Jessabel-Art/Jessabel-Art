<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jessabel OS — an interactive nature-workspace portfolio experience for Jessabel Santos: designer, developer, and business consultant."
    />
    <meta name="theme-color" content="#1c2a1e" />
    <title>Jessabel OS</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="boot-screen" id="bootScreen" aria-live="polite" aria-atomic="true">
      <div class="boot-content">
        <img class="boot-logo-image" src="jessabel-os-logo.png" alt="Jessabel OS logo" />
        <div class="boot-lines" aria-label="System startup status">
          <span>Watering the workspace...</span>
          <span>Loading projects...</span>
          <span>Connecting creative systems...</span>
          <span>Ready.</span>
        </div>
      </div>
    </div>

    <div class="desktop-shell" id="desktopShell">
      <div class="wallpaper" aria-hidden="true"></div>

      <header class="system-bar" aria-label="System status bar">
        <div class="system-left">
          <button class="home-button os-brand-button" id="desktopHomeButton" type="button" aria-label="Open desktop home">
            <img src="jessabel-os-logo.png" alt="Jessabel OS" />
          </button>
          <ul class="system-menu" role="menubar" aria-label="System menu">
            <li role="none"><button role="menuitem" aria-haspopup="true" aria-expanded="false" class="system-menu-item" data-menu="file" type="button">File</button></li>
            <li role="none"><button role="menuitem" aria-haspopup="true" aria-expanded="false" class="system-menu-item" data-menu="edit" type="button">Edit</button></li>
            <li role="none"><button role="menuitem" aria-haspopup="true" aria-expanded="false" class="system-menu-item" data-menu="view" type="button">View</button></li>
            <li role="none"><button role="menuitem" aria-haspopup="true" aria-expanded="false" class="system-menu-item" data-menu="window" type="button">Window</button></li>
            <li role="none"><button role="menuitem" class="system-menu-item" data-menu="help" type="button">Help</button></li>
          </ul>
        </div>

        <div class="system-dropdown hidden" id="systemDropdown" role="menu"></div>
        <div class="system-right">
          <span class="system-discovery-chip" id="systemDiscovery" aria-live="polite"></span>
          <span class="system-indicator" aria-label="Weather">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span class="indicator-text">72°F</span>
          </span>
          <span class="system-indicator" aria-label="Wi-Fi connected">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 8.5a16 16 0 0 1 20 0"/><path d="M5.5 12.5a11 11 0 0 1 13 0"/><path d="M9 16.5a6 6 0 0 1 6 0"/><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"/></svg>
          </span>
          <span class="system-indicator" aria-label="Battery 100%">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 10v4" stroke-linecap="round"/><rect x="4.5" y="9.5" width="13" height="5" fill="currentColor" stroke="none"/></svg>
          </span>
          <button class="system-search-btn" id="searchTrigger" type="button" aria-label="Open command palette (Ctrl+K or Cmd+K)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
          </button>
          <span class="system-datetime" id="systemTime" aria-live="polite">--:--</span>
        </div>
      </header>

      <main class="desktop" id="desktop" aria-label="Jessabel OS desktop workspace">
        <aside class="desktop-icons" id="desktopIcons" aria-label="desktop applications"></aside>

        <figure class="discovery-plant" aria-label="System discovery progress">
          <img id="discoveryPlantImage" src="pot-1.png" alt="A small seedling just planted in a pot" />
          <figcaption class="discovery-plant-label" id="discoveryPlantLabel">System Discovery 0/5</figcaption>
        </figure>
      </main>

      <div class="window-layer" id="windowLayer" aria-live="polite"></div>

      <div class="home-menu hidden" id="homeMenu" aria-label="Jessabel OS system menu">
        <button type="button" data-home-action="system">Jessabel OS</button>
        <button type="button" data-home-action="discovery">System Discovery</button>
        <button type="button" data-home-action="achievements">Achievements</button>
        <button type="button" data-home-action="palette">Command Palette</button>
        <button type="button" data-home-action="about">About System</button>
      </div>

      <div class="command-palette hidden" id="commandPalette" role="dialog" aria-modal="true" aria-label="Command palette">
        <div class="command-shell">
          <div class="command-header">
            <span>JESSABEL OS // COMMAND</span>
          </div>
          <label class="command-input-wrap" for="commandInput">
            <span class="command-prompt">&gt;_</span>
            <input id="commandInput" type="text" autocomplete="off" spellcheck="false" placeholder="Enter command" />
          </label>
          <div id="commandOutput" class="command-output hidden" aria-live="polite"></div>
          <div id="commandSuggestions" class="command-suggestions" aria-live="polite"></div>
        </div>
      </div>

      <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

      <nav class="dock" id="dock" aria-label="Application dock"></nav>
    </div>

    <template id="windowTemplate">
      <section class="window" tabindex="0">
        <header class="window-header">
          <div class="window-traffic" aria-label="Window actions">
            <button class="window-action close" type="button" aria-label="Close window"></button>
            <button class="window-action minimize" type="button" aria-label="Minimize window"></button>
            <button class="window-action maximize" type="button" aria-label="Maximize window"></button>
          </div>
          <div class="window-title-group">
            <span class="window-title-text"></span>
          </div>
          <button class="window-menu-btn" type="button" aria-label="Toggle window size">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
          </button>
        </header>
        <div class="window-body"></div>
      </section>
    </template>

    <template id="iconTemplate">
      <button class="desktop-icon" type="button">
        <span class="icon-graphic" aria-hidden="true"></span>
        <span class="icon-label"></span>
      </button>
    </template>

    <script src="script.js"></script>
  </body>
</html>
