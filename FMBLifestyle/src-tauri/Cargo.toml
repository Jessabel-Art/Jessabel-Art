[package]
name = "personal-finance-app"
version = "0.0.0"
description = "Finance My Best Lifestyle — a personal finance platform for budgeting, goals, net worth, savings, and financial clarity."
authors = ["Jessa"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "personal_finance_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

